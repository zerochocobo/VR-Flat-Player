# mpv configuration for VRHeadTrackingPlayer.
#
# This directory is passed to mpv as --config-dir, so nothing here touches the
# user's own %APPDATA%\mpv setup.
#
# Target: 8K equirectangular HEVC/AV1 on an RTX 5060 Ti. The guiding principle
# is "spend nothing on scaling quality" — at 8K the GPU budget goes to decode
# and to the mpv360 projection shader, and fancy scalers will drop frames long
# before they improve anything you can see through a 90-degree viewport.

# ---------------------------------------------------------------- output ---
vo=gpu-next
gpu-api=d3d11

# NOT auto-safe. On this box auto-safe resolves to d3d11va-copy, which reads
# every frame back to system RAM — at 8K that is ~47 MB per frame over PCIe and
# it halves decode throughput. Measured on an RTX 5060 Ti with a 7680x3840
# HEVC file, decode-only, 300 frames:
#
#   nvdec          35.9 fps      <- this
#   d3d11va        32.7 fps
#   software       34.4 fps
#   d3d11va-copy   17.0 fps      <- what auto-safe picked
#
# NOT nvdec either, despite it being the fastest in isolation: nvdec is a CUDA
# interop path and mpv rejects it on the d3d11 backend ("CUDA hwdec only works
# with OpenGL or Vulkan backends"), silently falling back to software. It has to
# match gpu-api above. d3d11va costs ~9% versus nvdec and actually engages.
#
# Verify it took effect — this must NOT say "no":
#   mpv --config-dir=<repo>/mpv --term-status-msg='${hwdec-current}' <file>
hwdec=d3d11va

profile=fast
scale=bilinear
cscale=bilinear
dscale=bilinear
dither-depth=8
deband=no
interpolation=no
correct-downscaling=no
sigmoid-upscaling=no

# ------------------------------------------------------------ demux/cache ---
# 8K VR files run 100-200 Mbps. Read far ahead so a slow disk cannot stall the
# decoder mid-pan.
cache=yes
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=512MiB
demuxer-readahead-secs=20

# -------------------------------------------------------------- playlist ---
# Opening one file makes a playlist of its whole folder, so "next episode" is a
# keypress instead of a trip through the file dialog. Doing it with mpv's own
# option rather than enumerating the directory ourselves is what makes uosc's
# prev/next buttons, its playlist panel, the < and > keys and our menu entries
# all agree — they are all views onto the same mpv playlist. Sorted by name,
# which is mpv's directory order.
autocreate-playlist=filter
directory-filter-types=video

# The folder, and only the folder. Not its subfolders.
#
# mpv's default for this is `auto`, which means `lazy`: subdirectories are added
# to the playlist as entries and expanded when playback reaches them. Opening
# one file from the root of a drive therefore queues the entire drive — a real
# session ended up playing, in order, F:\$RECYCLE.BIN, then a numbered folder,
# then a video four levels down inside a download directory, none of which the
# user could see from where they started.
#
# directory-filter-types above does not save you: it decides which *files* are
# admitted, and a directory is not a file.
#
# `ignore` is what "next episode" actually means. Anything the user cannot see
# in the folder they opened has no business being next.
directory-mode=ignore

# ------------------------------------------------------------- subtitles ---
# fuzzy, not exact: exact only finds "movie.srt" beside "movie.mkv", while
# fuzzy also picks up "movie.zh.srt", "movie.eng.ass" and the like, which is how
# subtitles actually arrive. They show up as ordinary tracks, so the Subtitle >
# Track menu and uosc list them with no extra code.
sub-auto=fuzzy

# ---------------------------------------------------------------- timing ---
video-sync=audio
framedrop=vo

# ------------------------------------------------------------------- misc ---
# uosc replaces the built-in OSC. Required: uosc will not draw while the stock
# one is active. script-opts/osc.conf is kept around only as a fallback if you
# ever set osc=yes again.
osc=no

# Keep the real Windows title bar. uosc can draw its own (top_bar=no-border),
# but an on-video title bar is exactly the "UI painted over the picture" look
# we do not want in windowed mode.
border=yes

# mpv moves the WINDOW when you drag the video with the left button, and it does
# this inside the win32 backend — below the input-binding layer, so a script
# binding cannot override it. Left-drag has to mean "look around" in a 360
# player, and the title bar (border=yes above) is still there for moving the
# window. Without this, drag-to-look does nothing and the window runs away.
window-dragging=no

keep-open=yes

# Both are needed for a player that can sit there with nothing open.
# force-window alone is not enough: it decides whether a window exists, while
# idle decides whether mpv stays alive once the playlist is empty. Without
# idle, "close file" (and finishing the last file) quits mpv, the IPC pipe
# drops, and the host window closes with it — the whole player disappears.
force-window=yes
idle=yes
osd-duration=1500
osd-font-size=32
screenshot-format=png

# A stereo VR file has two eyes side by side; mpv360's `eye` option picks one.
# Nothing to configure here — see script-opts/mpv360.conf.
