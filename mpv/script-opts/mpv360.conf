# mpv360 options — see https://github.com/kasper93/mpv360
#
# Two changes from upstream defaults:
#   1. enabled=yes, so 360 mode is live the moment a file opens.
#   2. Ctrl+r (upstream reset-view) is left alone; the bridge's own hotkeys all
#      live under Ctrl+Shift+... in input.conf to avoid colliding with these.

enabled=yes
show_values=yes

## Initial camera orientation, in RADIANS. The bridge overwrites yaw/pitch/roll
## every frame via glsl-shader-opts, but fov is left to mpv360 — adjust it here.
##
## 1.396 rad = 80°, matching PlayerModeController.FovDegrees. Keep the two in
## step: this one is what you see for the instant before the bridge connects,
## and a mismatch shows up as the picture jumping on every launch.
##
## 80° is a distortion limit, not a headset spec — a monitor has no lenses to
## undo the rectilinear stretch, so at upstream's 2.1 rad (120°) a face at the
## edge of the frame is twice as wide as it should be. See the comment on
## PlayerModeController.FovDegrees for the numbers.
yaw=0.0
pitch=0.0
roll=0.0
fov=1.396

## 0 = equirectangular. Cycle at runtime with Ctrl+Shift+p to find the right one
## for a given file, then set it here once you know.
input_projection=0

## Stereo eye selection for SBS / over-under sources.
eye=0

fisheye_fov=3.1415926535897932
sampling=0

invert_mouse=no
mouse_sensitivity=0.0035
step=0.013

## Keybindings (upstream defaults, kept so they are visible in one place).
toggle=Ctrl+e
look-up=Ctrl+up
look-down=Ctrl+down
look-left=Ctrl+left
look-right=Ctrl+right
roll-left=Ctrl+Shift+left
roll-right=Ctrl+Shift+right
fov-increase=Ctrl+Shift+down
fov-decrease=Ctrl+Shift+up
cycle-projection=Ctrl+Shift+p
fisheye-fov-increase=Ctrl+f
fisheye-fov-decrease=Ctrl+Shift+f
switch-eye=Ctrl+Shift+e
cycle-sampling=Ctrl+Shift+s
toggle-mouse-look=Ctrl+MBTN_LEFT
reset-view=Ctrl+r
show-help=Ctrl+t
