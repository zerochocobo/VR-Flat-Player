# mpv's built-in on-screen controller.
#
# The stock defaults are tuned for a small windowed player. Two things make the
# buttons tiny on a big display:
#
#   vidscale=yes  — the bar is scaled relative to the VIDEO, so an 8K source in
#                   a 4K window shrinks the controls instead of enlarging them.
#                   This is the main culprit for VR files.
#   scale*=1.0    — no compensation for high-DPI / large screens.
#
# So: decouple from video size, then scale up.

vidscale=no
scalewindowed=1.5
scalefullscreen=1.5
scaleforcedwindow=1.5

layout=bottombar
seekbarstyle=bar
seekbarkeyframes=no

# Keep the bar up a bit longer than the 500 ms default — hunting for a control
# that vanishes while you reach for it is the other half of "too small".
hidetimeout=2000
fadeduration=200

# Leave room so the VR mode bar and the OSC do not sit on top of each other.
barmargin=0
boxalpha=80
