# vrmenu — the in-video mode bar.

# Key that opens/closes the bar.
toggle_key=Tab

# Seconds of no interaction before it hides itself. 0 keeps it up until you
# press the toggle again.
auto_hide=6

# Pop the bar up automatically when a file opens.
#
# Off. It made sense when the bar was the only way to reach the mode switches,
# but there are now three (the VR menu in the menu bar, the VR button on the
# control bar, and Tab), so it stopped being discovery and became an overlay
# you have to sit and wait out before you can touch anything.
show_on_load=no

# Always-visible clickable chip in the top-right showing the current mode.
# Off because the uosc control bar already carries a VR button with the same
# information. Turn it on if you run without uosc.
show_indicator=no

# Multiplier on the automatic size (which already scales with window size).
scale=1.0

# Note: drag-to-look is NOT configured here. uosc holds MBTN_LEFT with a forced
# binding and does not pass presses on, so the bridge watches the mouse at the
# OS level instead. Its settings live in bridge.config.json under "input".
