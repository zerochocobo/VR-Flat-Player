# uosc — the control bar. Full option reference:
# https://github.com/tomasklaen/uosc/blob/HEAD/src/uosc.conf
#
# This file is ours and the installer never overwrites it.

# The controls row. `button:vrmode` is our externally managed button: vrmenu.lua
# registers it with set-button and keeps its badge in sync with the current
# projection, so the bar always shows what mode you are in and one click opens
# the full switcher.
# Laid out like the Windows 10 "Movies & TV" player: transport controls
# centred, everything else pushed to the edges. `space` is the flexible spacer
# that does the centring; `gap` is a fixed one.
#
# Note play-pause is NOT in uosc's default list (uosc expects you to click the
# video), and there is no `volume` item at all — volume is a separate side
# element, configured further down. Both of those are why the bar looked so
# bare: this line replaces uosc's default wholesale, so anything not named here
# simply does not appear.
controls=menu,<has_many_audio>audio,<video,audio>subtitles,space,command:replay_10:seek -10?Back 10s,play-pause,command:forward_30:seek 30?Forward 30s,space,button:vrmode,toggle:volume_up:mute?Mute,<has_chapter>chapters,fullscreen

# uosc's defaults (controls_size=32, timeline_size=40) are already far larger
# than mpv's stock OSC, which is what felt cramped. Only a mild bump here —
# an earlier attempt at 42 with font_scale 1.15 made the bar comically large in
# a 720p window. The `speed` slider is deliberately NOT in the controls row: it
# is a wide element that crowds out everything else, and it lives in the menu.
controls_size=36
controls_margin=8
timeline_size=40
volume_size=40
font_scale=1

# Keep the bar out of the way while watching, but keep it up while paused.
autohide=yes
timeline_persistency=paused
controls_persistency=paused

# No on-video title bar: mpv.conf keeps the real Windows title bar instead, so
# windowed playback looks like a normal desktop application rather than a video
# with UI painted on top of it.
top_bar=never

# Volume slider on the right edge. uosc has no volume item for the controls
# row; this element is the only way to get one.
volume=right

# Files uosc will offer when browsing / navigating a directory.
video_types=mp4,mkv,webm,mov,m4v,avi,wmv,ts,m2ts,mpg,mpeg,flv,ogv,3gp
