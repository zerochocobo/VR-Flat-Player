# Bridge hotkeys.
#
# `script-message` from a key binding is delivered to every mpv client,
# including the JSON IPC connection the bridge holds open — that is how these
# reach the bridge process without it needing window focus.
#
# All of these are Ctrl+Shift+... to stay clear of mpv360's own bindings
# (see script-opts/mpv360.conf).

# Recentre on one key as well as the chord. It is the most-used action in the
# whole player -- the head drifts, you straighten up, you want the picture
# straight again -- and a three-key chord is too much ceremony for that. HOME
# reads as "back to the start", and mpv binds nothing to it.
#
# Tab was the obvious alternative and is what VR-Reversal uses, but here it
# already opens the mode bar.
HOME          script-message headtrack recenter
Ctrl+Shift+r  script-message headtrack recenter
Ctrl+Shift+v  script-message headtrack reset-view

# Keyboard look, in view degrees: yaw first, then pitch, positive right and up.
#
# Through the bridge rather than mpv360's own Ctrl+arrow look bindings, which
# are still there and still fight it -- the bridge owns yaw/pitch and rewrites
# them every frame, so anything that moves mpv360's private copy is overwritten
# within milliseconds. Going through the mapper means a keyboard nudge lands in
# the same manual offset a mouse drag uses, and survives.
#
# Alt rather than Ctrl for exactly that reason: Ctrl+arrows are mpv360's.
Alt+LEFT      script-message headtrack look -5 0
Alt+RIGHT     script-message headtrack look 5 0
Alt+UP        script-message headtrack look 0 5
Alt+DOWN      script-message headtrack look 0 -5
Ctrl+Shift+h  script-message headtrack toggle
# No Shift in these. mpv folds Shift into the character for printable keys, so
# a host relaying Ctrl+Shift+[ sends "Ctrl+{" and a binding written as
# "Ctrl+Shift+[" can never match it. The keys silently did nothing.
Ctrl+]  script-message headtrack gain-up
Ctrl+[  script-message headtrack gain-down

# Field of view. All three routes -- wheel, keys, menu -- go through the bridge
# and step 5 degrees, so they agree with each other.
#
# The wheel is bound here rather than handled in the host window. mpv's window
# is a child of ours but it is *enabled*, which uosc needs in order to see hover
# and clicks, so mouse input reaches mpv and never reaches us: a WndProc handler
# in the host was silently dead, and what the user got was mpv's built-in wheel
# binding, volume.
#
# These also replace mpv360's own fov-increase / fov-decrease on the same keys.
# Those move mpv360's private copy of the field of view, which the bridge does
# not see, so the menu and the OSD would go on reporting the old number.
WHEEL_UP            script-message headtrack adjust-fov -5
WHEEL_DOWN          script-message headtrack adjust-fov 5
Ctrl+Shift+UP       script-message headtrack adjust-fov -5
Ctrl+Shift+DOWN     script-message headtrack adjust-fov 5
# Ctrl+0, and the middle mouse button. Not Ctrl+Shift+0: mpv folds Shift into
# the character for printable keys, so that arrives as Ctrl+) and the binding
# could never match — the same trap as Ctrl+Shift+[ eight lines above, walked
# into a second time. A real session's log has no set-fov in it at all.
#
# Clicking the wheel to undo what rolling it did is the obvious gesture, and
# mpv was already reporting "No key binding found for key 'MBTN_MID'".
Ctrl+0              script-message headtrack set-fov 80
MBTN_MID            script-message headtrack set-fov 80

# Volume, and it needs saying here because the wheel no longer does it.
#
# mpv's own defaults (9 / 0 and / / *) are still live and still work, but they
# step 2 while the Audio menu steps 5, so the same action gave two different
# answers depending on how it was reached. Bound explicitly at 5 to match, the
# same rule the field of view follows above.
#
# Shift+wheel because the plain wheel used to be volume and now is not. The
# reflex survives the change, so give it somewhere to land rather than leaving
# it to nudge the field of view by accident.
0                   add volume 5
9                   add volume -5
Shift+WHEEL_UP      add volume 5
Shift+WHEEL_DOWN    add volume -5

# Step through the renderer ladder. Bound to a key and not only to the menu
# because the reason to reach for it is a black picture, and you cannot use a
# menu you cannot see. The OSD names whatever it lands on.
Ctrl+Shift+b  script-message headtrack cycle-renderer

# Mode bar (vrmenu.lua). Tab is bound inside the script itself; these are the
# no-menu shortcuts for switching without opening it.
Ctrl+Shift+g  script-binding vrmenu/cycle-geometry
Ctrl+Shift+d  script-binding vrmenu/cycle-stereo
Ctrl+Shift+y  script-binding vrmenu/cycle-eye

# Handy while checking whether an 8K file is actually keeping up.
Ctrl+Shift+i  script-binding stats/display-page-1-toggle
